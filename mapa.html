                leafletMap = window[key];
                return true;
            }
        }
        return false;
    }

    function waitForMap(callback) {
        if (findMap()) { callback(); return; }
        var retries = 0;
        var iv = setInterval(function() {
            retries++;
            if (findMap()) { clearInterval(iv); callback(); }
            else if (retries > 50) { clearInterval(iv); console.warn('Mapa no encontrado'); }
        }, 200);
    }

    function collectGreenLayers() {

        leafletMap.eachLayer(function(layer) {

                greenLayers.push(layer);
            }
        });
    }

    function updateGreenVisibility() {
        var zoom = leafletMap.getZoom();
        var show = zoom >= 13;
        for (var i = 0; i < greenLayers.length; i++) {

                layer.setStyle({ opacity: 0, fillOpacity: 0, radius: 0 });

        if (!show && arrowLayers.length > 0) {
            removeArrows();

                  '</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });
    }

    function getEdgeLatLng(centerLatLng, targetLatLng) {
        var center = leafletMap.project(centerLatLng);
        var target = leafletMap.project(targetLatLng);
        var size = leafletMap.getSize();
        var dx = target.x - center.x;
        var dy = target.y - center.y;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return targetLatLng;
        var hw = size.x / 2 - 16;
        var hh = size.y / 2 - 16;
        var sx = dx !== 0 ? Math.abs(hw / dx) : Infinity;
        var sy = dy !== 0 ? Math.abs(hh / dy) : Infinity;
        var s = Math.min(sx, sy) * 0.85;
        var edgeX = center.x + dx * s;
        var edgeY = center.y + dy * s;
        return leafletMap.unproject([edgeX, edgeY]);

            al.setIcon(makeArrowIcon(angle));
        }
    }

    function addArrowsForRegion(regionId) {
        removeArrows();
        currentArrowRegion = regionId;
        var region = regiones[regionId];
        if (!region) return;

        var rLon = region.centro[1];

        for (var i = 0; i < greenPuntos.length; i++) {
            var gp = greenPuntos[i];
            var glat = gp.coords[0];
            var glon = gp.coords[1];

            nombre: p.nombre,
            tag: p.tag

        setTimeout(function() { addArrowsForRegion(p.id); }, 2200);

    ].join(' ');
    document.head.appendChild(cssStyle);

    waitForMap(function() {

            type: 'fly-to',
            index: 0,
            nombre: puntos[0].nombre,
            tag: puntos[0].tag
        }, '*');
    });
